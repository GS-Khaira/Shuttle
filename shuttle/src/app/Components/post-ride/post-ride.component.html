<div class="post-ride-form">
  <h2>Post a Ride</h2>
  <form (ngSubmit)="onSubmit()" #rideForm="ngForm">
     <gmpx-api-loader key="{{apiKey}}" solution-channel="GMP_GE_placepicker_v2">
    </gmpx-api-loader>
    <div class="form-row">
      <div class="form-group">
        <label for="from">From</label>
        <gmpx-place-picker placeholder="Enter an address" #placePicker></gmpx-place-picker>
      </div>
      <div class="form-group">
        <label for="to">To</label>
        <gmpx-place-picker placeholder="Enter an address" #placeDropper></gmpx-place-picker>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="date">Date</label>
        <input [(ngModel)]="ride.date" class="date-input" type="date" id="date" name="date" required />
      </div>
      <div class="form-group">
        <label for="time">Time</label>
        <input [(ngModel)]="ride.time" class="time-input" type="time" id="time" name="time" required />
      </div>
    </div>

    <div>
        <label for="luggage">Luggage Accepted</label>
        <input [(ngModel)]="ride.luggage" type="checkbox" id="luggage" name="luggage" />
    </div>
    <div>
        <label for="redirection">Redirection from orignal path</label>
        <input [(ngModel)]="ride.redirection" type="checkbox" id="redirection" name="redirection" />
    </div>

    <div class="form-group">
      <label for="seats">Number of Seats</label>
      <input
        [(ngModel)]="ride.seats"
        type="number"
        id="seats"
        name="seats"
        placeholder="Enter number of seat"
        required
      />
    </div>

    <div class="form-group">
      <label for="price">Price per Seat</label>
      <input
        [(ngModel)]="ride.price"
        type="number"
        id="price"
        name="price"
        placeholder="Enter price per seat"
        required
      />
    </div>

    <div class="form-group">
      <label for="comments">Comments</label>
      <input
        [(ngModel)]="ride.comments"
        type="text"
        id="comments"
        name="comments"
        placeholder="Add comments (optional)"
      />
    </div>

    <button type="submit" class="post-btn" [disabled]="rideForm.invalid">Post Ride</button>
  </form>
</div>
