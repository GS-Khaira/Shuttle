<div class="post-ride-form">
  <h2>Post a Ride</h2>
  <form>
    <div class="form-row">
      <div class="form-group">
        <label for="from">From</label>
        <input
          type="text"
          id="from"
          name="from"
          placeholder="Enter starting location"
          required
        />
      </div>
      <div class="form-group">
        <label for="to">To</label>
        <input
          type="text"
          id="to"
          name="to"
          placeholder="Enter destination"
          required
        />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="date">Date</label>
        <input class="date-input" type="date" id="date" name="date" required />
      </div>
      <div class="form-group">
        <label for="time">Time</label>
        <input class="time-input" type="time" id="time" name="time" required />
      </div>
    </div>

    <div>
        <label for="luggage">Luggage Accepted</label>
        <input type="checkbox" id="luggage" name="luggage" />
    </div>
    <div>
        <label for="luggage">Redirection from orignal path</label>
        <input type="checkbox" id="luggage" name="luggage" />
    </div>

    <div class="form-group">
      <label for="price">Price per Seat</label>
      <input
        type="number"
        id="price"
        name="price"
        placeholder="Enter price per seat"
        required
      />
    </div>

    <!-- Comments -->
    <div class="form-group">
      <label for="comments">Comments</label>
      <input
        type="text"
        id="comments"
        name="comments"
        placeholder="Add comments (optional)"
      />
    </div>

    <button type="submit" class="post-btn">Post Ride</button>
  </form>
</div>
