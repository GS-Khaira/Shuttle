<div class="singup-container">

        <form class="singup-form" id="singupForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input [(ngModel)]="email" type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input">
                    <input [(ngModel)]="password" type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Confirm Password</label>
                <div class="password-input">
                    <input [(ngModel)]="confirmPassword" type="password" id="password" name="password" placeholder="Confirm Password" required>
                </div>
                @if (confirmPassword !== password) {
                    <div class="error">
                        Password don't match!
                    </div>
                }
            </div>

            <button type="submit" class="singup-btn" (click)="onSignup()" [disabled]="confirmPassword !== password">Sign Up</button>
            @if (error !== '') {
                <div class="error-container">
                    <div class="error post-error">
                        {{error}}
                    </div>
                </div>
            }
        </form>
    </div>
