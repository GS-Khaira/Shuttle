<div class="p-6 bg-white min-h-screen font-sans find-shuttle">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-[#50B8DB]">Ride Search</h1>
    <div class="flex gap-4 text-[#50B8DB] font-medium text-sm">
      <button class="hover:underline">Sort</button>
      <button class="hover:underline">Filters</button>
    </div>
  </div>

  <div class="mb-4">
    <input
      type="text"
      placeholder="Search by location, driver, or date"
      class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm"
    />
  </div>

  <div class="flex items-center justify-between mb-4 text-sm text-gray-700">
    <label class="inline-flex items-center">
      <input type="checkbox" class="mr-2 accent-[#50B8DB]">
      <span>Show only available rides</span>
    </label>
    <label class="inline-flex items-center">
      <input type="checkbox" class="mr-2 accent-[#98C255]">
      <span>Include luggage transport</span>
    </label>
  </div>
  @if(foundRides.length > 0){
    @for (ride of foundRides; track $index) {
      <div class="ride-card">
        <div class="info">
          <div class="avatar">A</div>
          <div class="details">
            <h2>Alex Johnson</h2>
            <p>{{ride.from}} → {{ride.to}}</p>
            <p>Departure: {{ride.date}}, {{ride.time}}</p>
            <p>Seats Available: {{ride.seats}}</p>
          </div>
        </div>
        <div class="actions">
          <p>Cost: {{ride.price}}</p>
          <button class="primary-button">Book Ride</button>
        </div>
      </div>
    }
  }@else {
    <div>NO RIDE FOUND</div>
  }
</div>
