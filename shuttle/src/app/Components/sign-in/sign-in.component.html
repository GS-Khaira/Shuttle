<div class="signin-container">

        <form class="signin-form" id="signinForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input [(ngModel)]="email" type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input">
                    <input [(ngModel)]="password" type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input (click)="checkSeesion()" type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="signin-btn" (click)="onSignIn()">Sign In</button>

            @if (error !== '') {
                <div class="error-container">
                    <div class="error post-error">
                        {{error}}
                    </div>
                </div>
            }
        </form>

        <div class="signup-link">
            <p>Don't have an account? <a href="/signUp">Sign up here</a></p>
        </div>
    </div>
